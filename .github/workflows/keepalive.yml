name: Keep app alive

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app URL (with marker)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Repository secret APP_URL is not set. Set it in Settings → Secrets → Actions."
            exit 0
          fi
          # Basic validation: must start with http:// or https://
          if [[ ! "$APP_URL" =~ ^https?:// ]]; then
            echo "APP_URL appears malformed (must start with http:// or https://): '$APP_URL'" >&2
            exit 1
          fi
          MARKED_URL="$APP_URL/health?gh_action_keepalive=1"
          echo "Pinging $MARKED_URL"
          # Use a header so Render logs clearly identify this as the GitHub Actions keep-alive
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -H "X-Keepalive: github-actions" "$MARKED_URL" ) || true
          if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
            echo "Ping OK: $HTTP_CODE"
          else
            echo "Ping failed: $HTTP_CODE" >&2
            # Do not fail the entire workflow on a transient non-2xx; just surface the code
          fi
