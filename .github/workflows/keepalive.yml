name: Keep app alive

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app URL
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Repository secret APP_URL is not set. Set it in Settings → Secrets → Actions."
            exit 0
          fi
          echo "Pinging $APP_URL"
          # Use curl but don't fail the workflow on non-2xx so we don't spam failures
          curl -fsS "$APP_URL" || echo "Ping failed (non-2xx or network error)"
